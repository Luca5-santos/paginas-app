name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar a pasta www (acha os arquivos do app onde estiverem)
        run: |
          mkdir -p www
          for f in index.html manifest.json sw.js icon.png apple-touch-icon.png; do
            if [ ! -f "www/$f" ]; then
              p=$(find . -type f -name "$f" -not -path "./node_modules/*" -not -path "./android/*" -not -path "./.git/*" -not -path "./www/*" | head -1)
              if [ -n "$p" ]; then cp "$p" "www/$f"; fi
            fi
          done
          echo "Conteúdo da pasta www:"
          ls -la www
          if [ ! -f www/index.html ]; then
            echo "ERRO: não encontrei o arquivo index.html no repositório. Envie a pasta www do zip para o GitHub."
            exit 1
          fi

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones do app (se falhar, usa o ícone padrão)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#7438ef" --iconBackgroundColorDark "#7438ef"

      - name: Permissões de notificação
        run: |
          sed -i "s#<application#<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />\n    <application#" android/app/src/main/AndroidManifest.xml

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Usar a chave fixa do app (mantém seus dados ao atualizar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: paginas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
