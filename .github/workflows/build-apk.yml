name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones do app (se falhar, usa o ícone padrão)
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#7438ef" --iconBackgroundColorDark "#7438ef"

      - name: Permissões de notificação
        run: |
          sed -i "s#<application#<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />\n    <application#" android/app/src/main/AndroidManifest.xml

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Usar a chave fixa do app (mantém seus dados ao atualizar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: paginas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
